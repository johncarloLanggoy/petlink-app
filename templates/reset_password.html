<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — PetLink</title>
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/logo.jpg') }}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #eaf3e0 0%, #d4e5c4 40%, #c5d9b4 70%, #eaf3e0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    /* Floating particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      background: rgba(123, 160, 91, 0.2);
      border-radius: 50%;
      animation: float 15s infinite;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0; }
      50% { opacity: 0.4; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 25px 50px -12px rgba(123, 160, 91, 0.2);
      border: 1px solid rgba(123, 160, 91, 0.12);
      position: relative;
      z-index: 1;
      animation: slideUpFade 0.6s cubic-bezier(0.34, 1.2, 0.64, 1);
    }

    @keyframes slideUpFade {
      0% {
        opacity: 0;
        transform: translateY(50px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
      animation: fadeIn 0.8s ease 0.2s both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .brand-icon {
      font-size: 48px;
      margin-bottom: 10px;
      color: #7ba05b;
      transition: transform 0.3s ease;
    }

    .brand-icon:hover {
      transform: scale(1.05) rotate(-5deg);
    }

    .brand-name {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #5a7a3f, #7ba05b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h2 {
      color: #2d3e1f;
      font-size: 24px;
      margin-bottom: 8px;
      animation: slideInLeft 0.6s ease 0.3s both;
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .subtitle {
      color: #4a5a3f;
      font-size: 14px;
      margin-bottom: 30px;
      animation: slideInLeft 0.6s ease 0.35s both;
    }

    .form-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: slideInRight 0.6s ease both;
    }

    .field:nth-child(1) { animation-delay: 0.4s; }
    .field:nth-child(2) { animation-delay: 0.5s; }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    label {
      color: #3d5429;
      font-size: 14px;
      font-weight: 500;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      color: #94a387;
      transition: all 0.3s ease;
    }

    input {
      width: 100%;
      padding: 12px 12px 12px 40px;
      background: #f7fbf3;
      border: 2px solid #d4e5c4;
      border-radius: 12px;
      color: #2d3e1f;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    input::placeholder {
      color: #94a387;
    }

    input:focus {
      outline: none;
      border-color: #7ba05b;
      box-shadow: 0 0 0 4px rgba(123, 160, 91, 0.15);
      transform: scale(1.01);
      background: #ffffff;
    }

    .eye-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      color: #94a387;
      transition: all 0.3s ease;
    }

    .eye-toggle:hover {
      color: #7ba05b;
      transform: scale(1.1);
    }

    .strength-wrap {
      margin-top: 8px;
    }

    .strength-bar-track {
      height: 4px;
      background: #d4e5c4;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .strength-bar-fill {
      height: 100%;
      border-radius: 99px;
      width: 0%;
      transition: width 0.35s ease, background 0.35s ease;
    }

    .strength-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #94a387;
      transition: color 0.3s;
    }

    .req-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
    }

    .req-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #94a387;
      transition: all 0.3s ease;
    }

    .req-item.met {
      color: #10b981;
      transform: translateX(5px);
    }

    .req-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #94a387;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
      transition: all 0.3s ease;
      color: transparent;
    }

    .req-item.met .req-icon {
      background: #10b981;
      border-color: #10b981;
      color: #fff;
      transform: scale(1.1);
    }

    .btn-primary {
      background: linear-gradient(135deg, #7ba05b, #5a7a3f);
      color: #fff;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.6s ease 0.6s both;
      box-shadow: 0 4px 20px rgba(123, 160, 91, 0.3);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(123, 160, 91, 0.45);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn-primary:active::before {
      width: 300px;
      height: 300px;
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid #10b981;
      color: #10b981;
      animation: successPulse 0.5s ease;
    }

    @keyframes successPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .message.error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    .card-footer {
      margin-top: 30px;
      text-align: center;
      padding-top: 20px;
      border-top: 1px solid #d4e5c4;
      animation: fadeIn 0.6s ease 0.65s both;
    }

    .card-footer a {
      color: #5a7a3f;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.3s ease;
      display: inline-block;
      font-weight: 500;
    }

    .card-footer a:hover {
      color: #7ba05b;
      transform: translateX(5px);
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.6s linear infinite;
      margin-left: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── RESPONSIVE ────────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
      }
      
      .brand-name {
        font-size: 24px;
      }
      
      h2 {
        font-size: 20px;
      }
    }

    /* ── SUCCESS OVERLAY ───────────────────────────────────────────── */
    .redirect-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      animation: fadeIn 0.3s ease;
    }

    .redirect-content {
      text-align: center;
      background: #ffffff;
      padding: 40px;
      border-radius: 24px;
      border: 1px solid #7ba05b;
      box-shadow: 0 20px 40px rgba(123, 160, 91, 0.15);
      animation: slideUpFade 0.4s ease;
    }

    .redirect-content h3 {
      color: #2d3e1f;
    }

    .redirect-content p {
      color: #4a5a3f;
    }

    .redirect-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid #d4e5c4;
      border-top-color: #7ba05b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }
  </style>
</head>
<body>
  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <div class="card">
    <div class="brand">
      <div class="brand-icon"><i class="fas fa-key"></i></div>
      <span class="brand-name">Petlink Serrano St.</span>
    </div>

    <h2>Set new password</h2>
    <p class="subtitle">Choose a strong password. This link expires 15 minutes after it was generated.</p>

    <div class="form-stack">
      <div class="field">
        <label for="password"><i class="fas fa-lock" style="margin-right: 6px; color: #7ba05b;"></i> New Password</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password" placeholder="New strong password" autocomplete="new-password" required style="padding-right:42px;" oninput="checkStrength(this.value)">
          <button type="button" class="eye-toggle" onclick="toggleEye('password', this)" aria-label="Toggle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="strength-wrap">
          <div class="strength-bar-track"><div class="strength-bar-fill" id="strengthBar"></div></div>
          <span class="strength-label" id="strengthLabel">Enter a password</span>
        </div>
        <div class="req-list">
          <div class="req-item" id="req-len">
            <div class="req-icon"><i class="fas fa-check"></i></div> At least 8 characters
          </div>
          <div class="req-item" id="req-upper">
            <div class="req-icon"><i class="fas fa-check"></i></div> One uppercase letter (A-Z)
          </div>
          <div class="req-item" id="req-lower">
            <div class="req-icon"><i class="fas fa-check"></i></div> One lowercase letter (a-z)
          </div>
          <div class="req-item" id="req-num">
            <div class="req-icon"><i class="fas fa-check"></i></div> One number (0-9)
          </div>
          <div class="req-item" id="req-special">
            <div class="req-icon"><i class="fas fa-check"></i></div> One special character (!@#$%^&*)
          </div>
        </div>
      </div>

      <div class="field">
        <label for="confirm"><i class="fas fa-check-circle" style="margin-right: 6px; color: #7ba05b;"></i> Confirm Password</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          <input type="password" id="confirm" placeholder="Repeat new password" autocomplete="new-password" required style="padding-right:42px;">
          <button type="button" class="eye-toggle" onclick="toggleEye('confirm', this)" aria-label="Toggle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn-primary" id="resetBtn" onclick="handleReset()">
        <span id="btnText"><i class="fas fa-save"></i> Reset password</span>
      </button>
    </div>

    <div id="message" class="message"></div>
    <div class="card-footer">
      <a href="/login"><i class="fas fa-arrow-left"></i> Back to sign in</a>
    </div>
  </div>

  <script>
    // ── Create floating particles ──────────────────────────────────
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        const size = Math.random() * 5 + 2;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.top = `${Math.random() * 100}%`;
        particle.style.animationDelay = `${Math.random() * 15}s`;
        particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
        particlesContainer.appendChild(particle);
      }
    }
    createParticles();

    // ── Get token from URL ──────────────────────────────────────────
    const token = new URLSearchParams(window.location.search).get('token') || '';

    // ── Password Strength Checker ──────────────────────────────────
    const rules = [
      { id: 'req-len',     test: p => p.length >= 8 },
      { id: 'req-upper',   test: p => /[A-Z]/.test(p) },
      { id: 'req-lower',   test: p => /[a-z]/.test(p) },
      { id: 'req-num',     test: p => /[0-9]/.test(p) },
      { id: 'req-special', test: p => /[^A-Za-z0-9]/.test(p) },
    ];

    const levels = [
      { label: 'Very weak',   color: '#ef4444', pct: '20%'  },
      { label: 'Weak',        color: '#f97316', pct: '40%'  },
      { label: 'Fair',        color: '#eab308', pct: '60%'  },
      { label: 'Strong',      color: '#22c55e', pct: '80%'  },
      { label: 'Very strong', color: '#34d399', pct: '100%' },
    ];

    function checkStrength(password) {
      const metCount = rules.filter(r => r.test(password)).length;
      rules.forEach(r => document.getElementById(r.id).classList.toggle('met', r.test(password)));
      const bar = document.getElementById('strengthBar');
      const label = document.getElementById('strengthLabel');
      if (!password) { 
        bar.style.width = '0%'; 
        label.textContent = 'Enter a password'; 
        label.style.color = '#94a387'; 
        return; 
      }
      const level = levels[metCount - 1] || levels[0];
      bar.style.width = level.pct; 
      bar.style.background = level.color;
      label.textContent = level.label; 
      label.style.color = level.color;
    }

    function isStrongEnough(p) { 
      return rules.every(r => r.test(p)); 
    }

    // ── Toggle Password Visibility ──────────────────────────────────
    function toggleEye(id, btn) {
      const input = document.getElementById(id);
      const hidden = input.type === 'password';
      input.type = hidden ? 'text' : 'password';
      btn.innerHTML = hidden
        ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    }

    // ── Show Redirect Overlay ──────────────────────────────────────
    function showRedirectOverlay() {
      const overlay = document.createElement('div');
      overlay.className = 'redirect-overlay';
      overlay.innerHTML = `
        <div class="redirect-content">
          <div style="font-size: 60px; color: #10b981; margin-bottom: 15px;"><i class="fas fa-check-circle"></i></div>
          <h3 style="color: #2d3e1f; margin-bottom: 10px;">Password Reset Successful!</h3>
          <p style="color: #4a5a3f; margin-bottom: 20px;">Your password has been updated. Redirecting to login...</p>
          <div class="redirect-spinner"></div>
        </div>
      `;
      document.body.appendChild(overlay);
      
      setTimeout(() => {
        if (overlay && overlay.parentNode) {
          overlay.remove();
        }
      }, 1500);
    }

    // ── Handle Password Reset ──────────────────────────────────────
    async function handleReset() {
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      const msg      = document.getElementById('message');
      const btn = document.getElementById('resetBtn');
      const btnText = document.getElementById('btnText');
      
      const show = (text, type) => { 
        msg.textContent = text; 
        msg.className = 'message show ' + type; 
        setTimeout(() => {
          msg.classList.remove('show');
        }, 5000);
      };

      if (!password) return show('Please enter a new password.', 'error');
      if (!isStrongEnough(password)) return show('Password does not meet all requirements.', 'error');
      if (password !== confirm) return show('Passwords do not match.', 'error');
      if (!token) return show('Missing reset token.', 'error');

      // Show loading state
      btnText.innerHTML = 'Resetting... <span class="loading"></span>';
      btn.disabled = true;

      try {
        const res = await fetch('/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();
        
        // Reset button
        btnText.innerHTML = '<i class="fas fa-save"></i> Reset password';
        btn.disabled = false;
        
        show(data.message, data.success ? 'success' : 'error');
        
        if (data.success) {
          // Add success animation to card
          const card = document.querySelector('.card');
          card.style.animation = 'none';
          card.offsetHeight;
          card.style.animation = 'slideUpFade 0.6s cubic-bezier(0.34, 1.2, 0.64, 1)';
          
          showRedirectOverlay();
          
          setTimeout(() => {
            window.location.href = '/login';
          }, 2000);
        }
      } catch { 
        btnText.innerHTML = '<i class="fas fa-save"></i> Reset password';
        btn.disabled = false;
        show('Something went wrong. Please try again.', 'error'); 
      }
    }

    // ── Make functions globally available ──────────────────────────
    window.handleReset = handleReset;
    window.checkStrength = checkStrength;
    window.toggleEye = toggleEye;

    // ── Enter key support ──────────────────────────────────────────
    document.addEventListener('keydown', e => { 
      if (e.key === 'Enter') handleReset(); 
    });
    
    // ── Input focus animations ──────────────────────────────────────
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
      input.addEventListener('focus', () => {
        input.parentElement.style.transform = 'scale(1.01)';
      });
      input.addEventListener('blur', () => {
        input.parentElement.style.transform = 'scale(1)';
      });
    });
  </script>
</body>
</html>
