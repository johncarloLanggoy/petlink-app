<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — PetLink</title>
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/logo.jpg') }}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/forgot_password.css') }}">
</head>
<body>
  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <div class="card">
    <div class="brand">
      <div class="brand-icon"><i class="fas fa-key"></i></div>
      <span class="brand-name">Petlink Serrano St.</span>
    </div>

    <h2>Reset your password</h2>
    <p class="subtitle">Enter your email and we'll generate a secure reset link (expires in 15 min)</p>

    <div class="form-stack">
      <div class="field">
        <label for="email"><i class="fas fa-envelope" style="margin-right: 6px; color: #7ba05b;"></i> Email Address</label>
        <div class="input-wrap">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" id="email" placeholder="Your email address" autocomplete="email" required>
        </div>
      </div>
      <button class="btn-primary" id="resetBtn" onclick="handleForgot()">
        <span id="btnText"><i class="fas fa-paper-plane"></i> Generate reset link</span>
      </button>
    </div>

    <div id="message" class="message"></div>
    <div id="resetLinkBox" style="display:none;" class="reset-link-box">
      <p><i class="fas fa-link"></i> Reset Link (demo only — email in production)</p>
      <a id="resetLink" href="#" target="_blank"></a>
    </div>

    <div class="card-footer">
      <a href="/login"><i class="fas fa-arrow-left"></i> Back to sign in</a>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/forgot_password.js') }}"></script>
</body>
</html>
